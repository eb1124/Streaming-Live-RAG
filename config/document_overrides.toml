# Curated, per-document corrections. Keyed by the ORIGINAL filename in corpus/.
#
# Rules (enforced by ingestion/metadata.py; rejected overrides produce an `override_rejected` warning):
#   Facts about the document -- title, organization, version, effective_date, revision_date:
#       { value, evidence, note? }   `evidence` must literally occur in the PDF text or PDF metadata
#                                     (the filename does not count).
#   Curator classification / acquisition provenance -- domain, document_type, authority_level,
#   source_url, captured_at:
#       { value, basis, evidence? }  `basis` is required; `evidence`, if given, is verified.
#   Document identity across versions (curated; `basis` required) -- series_id, superseded_date, is_current:
#       series_id        shared by every version of the same document (no series_id = only version in corpus)
#       superseded_date  the date a newer version took effect
#       is_current       true | false, as of the curation date; omitted = unknown (null)
#   drop_line_patterns               regexes (full-line match) for noise the generic rules cannot remove.
#   calibri_fonts                    font-name substrings to treat as Calibri for ligature repair
#                                    (PDFs whose embedded font names are anonymized).
#   profile                          force a profile (see ingestion/profiles.py).
#   exclude_sections_from_retrieval  [{ title, reason }]: blocks stay in the JSON, flagged for the chunker.
#   curator_warnings                 free-text issues surfaced in the manifest and validation report.
#
# Vocabularies
#   domain          travel_expenses | procurement | remote_work | information_security
#   document_type   policy | procedure | standard | guidance
#   authority_level authoritative  - the issuer's official text (issued PDF, or explicitly designated official)
#                   official_web   - browser capture of the issuer's official policy web page
#                   informational  - service / guidance content, not a policy instrument
#
# Replacement history and sources: corpus_archive/README.md

